name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Restore
        run: dotnet restore
        working-directory: backend
      - name: Build
        run: dotnet build --no-restore -c Release
        working-directory: backend
      - name: Test
        run: dotnet test --no-build -c Release
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web

  mcp:
    runs-on: ubuntu-latest
    env:
      # CI-only throw-away root password for the disposable service container.
      # Not a real secret: the database exists only for this job.
      MYSQL_ROOT_PASSWORD: ci-only-root-password
      MCP_DB_HOST: 127.0.0.1
      MCP_DB_PORT: '3306'
      MCP_DB_NAME: larchmont
      MCP_DB_USER: mcp_readonly
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: larchmont
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Apply schema migrations V001 to V007
        run: |
          for f in backend/db/migrations/V00{1..7}__*.sql; do
            echo "Applying $f"
            mysql -h 127.0.0.1 -P 3306 -u root -p"$MYSQL_ROOT_PASSWORD" larchmont < "$f"
          done
      - name: Create MCP views
        run: mysql -h 127.0.0.1 -P 3306 -u root -p"$MYSQL_ROOT_PASSWORD" < db-setup/02-mcp-views.sql
      - name: Create MCP read-only user
        run: |
          MCP_DB_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$MCP_DB_PASSWORD"
          echo "MCP_DB_PASSWORD=$MCP_DB_PASSWORD" >> "$GITHUB_ENV"
          MCP_DB_PASSWORD="$MCP_DB_PASSWORD" bash db-setup/run-03-create-mcp-user.sh
        env:
          MYSQL_PWD: ci-only-root-password
      - name: Install
        run: npm ci
        working-directory: mcp
      - name: Build
        run: npm run build
        working-directory: mcp
      - name: Unit and mocked tests
        run: npm test
        working-directory: mcp
      - name: MySQL integration tests
        run: npm run test:mysql
        working-directory: mcp
        env:
          MCP_TEST_MYSQL_ADMIN_URL: mysql://root:ci-only-root-password@127.0.0.1:3306
