<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .h1 { font-size: 32px; font-weight: 700; fill: #0b0b0b; }
    .sub { font-size: 16px; fill: #52514e; }
    .ax { font-size: 13px; fill: #52514e; }
    .cat { font-size: 15px; font-weight: 600; fill: #0b0b0b; }
    .val { font-size: 15px; font-weight: 700; fill: #0b0b0b; }
    .lg { font-size: 15px; fill: #0b0b0b; }
    .t { font-size: 17px; font-weight: 700; fill: #0b0b0b; }
    .d { font-size: 14px; fill: #52514e; }
  </style>
  <rect width="1200" height="1040" fill="#fcfcfb"/>
  <text x="600" y="56" text-anchor="middle" class="h1">Bug LH-56: the occupancy report made hotels look fuller</text>
  <text x="600" y="86" text-anchor="middle" class="sub">How full the hotels were in the week of 1–7 October 2026. ✔ Fixed.</text>

  <!-- legend -->
  <rect x="330" y="108" width="16" height="16" rx="3" fill="#eb6834"/>
  <text x="354" y="121" class="lg">What the report said (wrong)</text>
  <rect x="630" y="108" width="16" height="16" rx="3" fill="#2a78d6"/>
  <text x="654" y="121" class="lg">Real count from the night audit</text>

  <!-- grid: 0..60%, baseline y=560, 1% = 6.667px -->
  <g stroke="#e5e5e2" stroke-width="1">
    <line x1="110" y1="160" x2="1100" y2="160"/>
    <line x1="110" y1="293.3" x2="1100" y2="293.3"/>
    <line x1="110" y1="426.7" x2="1100" y2="426.7"/>
  </g>
  <line x1="110" y1="560" x2="1100" y2="560" stroke="#a3a29d" stroke-width="1"/>
  <text x="98" y="565" text-anchor="end" class="ax">0%</text>
  <text x="98" y="431" text-anchor="end" class="ax">20%</text>
  <text x="98" y="298" text-anchor="end" class="ax">40%</text>
  <text x="98" y="165" text-anchor="end" class="ax">60%</text>

  <!-- Group 1: Edinburgh, Fri 2 Oct  45 vs 25 -->
  <g>
    <path d="M190,560 V264 a4,4 0 0 1 4,-4 H274 a4,4 0 0 1 4,4 V560 Z" fill="#eb6834"><title>Edinburgh, Fri 2 Oct: report said 45% (9 rooms)</title></path>
    <path d="M282,560 V397.3 a4,4 0 0 1 4,-4 H366 a4,4 0 0 1 4,4 V560 Z" fill="#2a78d6"><title>Edinburgh, Fri 2 Oct: real 25% (5 rooms)</title></path>
    <text x="234" y="250" text-anchor="middle" class="val">45%</text>
    <text x="326" y="383" text-anchor="middle" class="val">25%</text>
    <text x="280" y="588" text-anchor="middle" class="cat">Edinburgh, Fri 2 Oct</text>
    <text x="280" y="608" text-anchor="middle" class="ax">9 rooms vs really 5</text>
  </g>

  <!-- Group 2: Edinburgh week 49.3 vs 32.1 -->
  <g>
    <path d="M510,560 V235.3 a4,4 0 0 1 4,-4 H594 a4,4 0 0 1 4,4 V560 Z" fill="#eb6834"><title>Edinburgh, week: report said 49.3% (69 room nights)</title></path>
    <path d="M602,560 V350 a4,4 0 0 1 4,-4 H686 a4,4 0 0 1 4,4 V560 Z" fill="#2a78d6"><title>Edinburgh, week: real 32.1% (45 room nights)</title></path>
    <text x="554" y="221" text-anchor="middle" class="val">49.3%</text>
    <text x="646" y="336" text-anchor="middle" class="val">32.1%</text>
    <text x="600" y="588" text-anchor="middle" class="cat">Edinburgh, whole week</text>
    <text x="600" y="608" text-anchor="middle" class="ax">69 room-nights vs really 45</text>
  </g>

  <!-- Group 3: All hotels week 39.8 vs 26.9 -->
  <g>
    <path d="M830,560 V298.7 a4,4 0 0 1 4,-4 H914 a4,4 0 0 1 4,4 V560 Z" fill="#eb6834"><title>All 6 hotels, week: report said 39.8% (334 room nights)</title></path>
    <path d="M922,560 V384.7 a4,4 0 0 1 4,-4 H1006 a4,4 0 0 1 4,4 V560 Z" fill="#2a78d6"><title>All 6 hotels, week: real 26.9% (226 room nights)</title></path>
    <text x="874" y="284" text-anchor="middle" class="val">39.8%</text>
    <text x="966" y="370" text-anchor="middle" class="val">26.9%</text>
    <text x="920" y="588" text-anchor="middle" class="cat">All 6 hotels, whole week</text>
    <text x="920" y="608" text-anchor="middle" class="ax">334 room-nights vs really 226</text>
  </g>

  <!-- explainer -->
  <rect x="40" y="644" width="1120" height="250" rx="14" fill="#fff" stroke="#e5e5e2" stroke-width="2"/>
  <text x="64" y="680" class="t">Why it happened: one guest, one night</text>

  <text x="64" y="726" class="d">Thu 1 Oct</text>
  <text x="474" y="726" class="d">Fri 2 Oct</text>
  <rect x="150" y="708" width="300" height="28" rx="4" fill="#2a78d6"/>
  <text x="300" y="727" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">🛏 Guest sleeps here (1 night)</text>
  <text x="560" y="727" class="d">🧳 Guest leaves in the morning. Room empty that night.</text>

  <text x="64" y="782" font-size="15" font-weight="700" fill="#b91c1c">✖ Old rule</text>
  <text x="180" y="782" class="d">counted every day from arrival up to and including the checkout day → 2 nights</text>
  <text x="64" y="814" font-size="15" font-weight="700" fill="#15803d">✔ New rule</text>
  <text x="180" y="814" class="d">counts every day from arrival up to but not including the checkout day → 1 night</text>

  <text x="64" y="856" class="d">Four Edinburgh guests left on 2 Oct, so that night showed 9 rooms sold instead of 5.</text>
  <text x="64" y="878" class="d">The revenue manager was setting room prices from these inflated numbers.</text>

  <rect x="40" y="914" width="1120" height="96" rx="14" fill="#fffbeb" stroke="#b45309"/>
  <text x="64" y="948" class="t">The fix was one character</text>
  <text x="64" y="976" font-family="Consolas, monospace" font-size="14" fill="#52514e">before: day <text x="64" y="976" font-family="Consolas, monospace" font-size="14" fill="#52514e">before:  day &lt;= checkout      after:  day &lt; checkout</text>lt;= checkout</text><text x="360" y="976" font-family="Consolas, monospace" font-size="14" fill="#52514e">after: day <text x="64" y="976" font-family="Consolas, monospace" font-size="14" fill="#52514e">before:  day &lt;= checkout      after:  day &lt; checkout</text>lt; checkout</text>
  <text x="64" y="998" class="d">⚠ There is still no automatic check that proves the fix stays fixed (open bug G).</text>
</svg>
