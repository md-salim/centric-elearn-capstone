<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1330" viewBox="0 0 1200 1330" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <style>
    .h1 { font-size: 32px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 16px; fill: #4b5563; }
    .n { font-size: 14px; font-weight: 700; fill: #6b7280; }
    .t { font-size: 18px; font-weight: 700; fill: #111827; }
    .d { font-size: 14px; fill: #4b5563; }
    .s { font-size: 13px; font-weight: 700; }
  </style>
  <rect width="1200" height="1330" fill="#f9fafb"/>
  <text x="600" y="56" text-anchor="middle" class="h1">How the code got built, step by step</text>
  <text x="600" y="86" text-anchor="middle" class="sub">✔ done   ⚠ started or partly done   ✖ never done</text>

  <!-- 0 request -->
  <rect x="400" y="110" width="400" height="60" rx="30" fill="#1f2937"/>
  <text x="600" y="147" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">💬 Manager's wish-list (stakeholder brief)</text>
  <line x1="600" y1="170" x2="600" y2="200" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>

  <!-- 1 spec -->
  <rect x="300" y="204" width="600" height="84" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="322" y="232" class="n">STEP 1</text>
  <text x="322" y="256" class="t">📝 Requirements written</text>
  <text x="322" y="278" class="d">Spec writer turned the wish-list into clear rules</text>
  <text x="878" y="232" text-anchor="end" class="s" fill="#15803d">✔ DONE</text>
  <line x1="600" y1="288" x2="600" y2="318" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2 plan -->
  <rect x="300" y="322" width="600" height="84" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="322" y="350" class="n">STEP 2</text>
  <text x="322" y="374" class="t">📋 Plan written first (/plan)</text>
  <text x="322" y="396" class="d">13 plans written, one before each piece was built</text>
  <text x="878" y="350" text-anchor="end" class="s" fill="#15803d">✔ DONE</text>
  <line x1="600" y1="406" x2="600" y2="436" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3 data expert -->
  <rect x="300" y="440" width="600" height="84" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="322" y="468" class="n">STEP 3</text>
  <text x="322" y="492" class="t">📊 Data Expert studied the database</text>
  <text x="322" y="514" class="d">Warned about slow spots and clashes before building</text>
  <text x="878" y="468" text-anchor="end" class="s" fill="#15803d">✔ DONE</text>
  <line x1="600" y1="524" x2="600" y2="554" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4 tester -->
  <rect x="300" y="558" width="600" height="84" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="322" y="586" class="n">STEP 4</text>
  <text x="322" y="610" class="t">🧪 Tester wrote the checks first</text>
  <text x="322" y="632" class="d">Each check proven to fail before the real code existed</text>
  <text x="878" y="586" text-anchor="end" class="s" fill="#15803d">✔ DONE</text>

  <!-- fan out -->
  <line x1="600" y1="642" x2="600" y2="664" stroke="#6b7280" stroke-width="2"/>
  <line x1="220" y1="664" x2="980" y2="664" stroke="#6b7280" stroke-width="2"/>
  <line x1="220" y1="664" x2="220" y2="690" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="664" x2="600" y2="690" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="980" y1="664" x2="980" y2="690" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <text x="240" y="656" class="d">STEP 5: builders work at the same time</text>

  <rect x="60" y="694" width="320" height="110" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="80" y="722" class="t">🔧 Back-office Builder</text>
  <text x="80" y="746" class="d">Built the room-cleaning system:</text>
  <text x="80" y="766" class="d">~15 code files, 3 database changes</text>
  <text x="80" y="792" class="s" fill="#15803d">✔ DONE</text>

  <rect x="440" y="694" width="320" height="110" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="460" y="722" class="t">🔌 Helpers</text>
  <text x="460" y="746" class="d">Built the data connection</text>
  <text x="460" y="766" class="d">and its 167 checks</text>
  <text x="460" y="792" class="s" fill="#15803d">✔ BUILT (never connected)</text>

  <rect x="820" y="694" width="320" height="110" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="840" y="722" class="t">🎨 Screen Designer</text>
  <text x="840" y="746" class="d">No screens made. Staff cannot</text>
  <text x="840" y="766" class="d">see the cleaning board yet.</text>
  <text x="840" y="792" class="s" fill="#b45309">⚠ NOT STARTED</text>

  <line x1="220" y1="804" x2="220" y2="830" stroke="#6b7280" stroke-width="2"/>
  <line x1="600" y1="804" x2="600" y2="830" stroke="#6b7280" stroke-width="2"/>
  <line x1="980" y1="804" x2="980" y2="830" stroke="#6b7280" stroke-width="2"/>
  <line x1="220" y1="830" x2="980" y2="830" stroke="#6b7280" stroke-width="2"/>
  <line x1="600" y1="830" x2="600" y2="856" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>

  <!-- 6 review -->
  <rect x="300" y="860" width="600" height="84" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="322" y="888" class="n">STEP 6</text>
  <text x="322" y="912" class="t">🔍 Inspector reviewed the work</text>
  <text x="322" y="934" class="d">Found 9 problems. Verdict: "Do not merge"</text>
  <text x="878" y="888" text-anchor="end" class="s" fill="#15803d">✔ DONE</text>
  <line x1="600" y1="944" x2="600" y2="974" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>

  <!-- 7 fix round -->
  <rect x="300" y="978" width="600" height="84" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="322" y="1006" class="n">STEP 7</text>
  <text x="322" y="1030" class="t">🔁 Fix the problems found</text>
  <text x="322" y="1052" class="d">Never run, so the biggest bugs are still open</text>
  <text x="878" y="1006" text-anchor="end" class="s" fill="#b91c1c">✖ NEVER DONE</text>
  <line x1="600" y1="1062" x2="600" y2="1092" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>

  <!-- 8 live -->
  <rect x="300" y="1096" width="600" height="84" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="322" y="1124" class="n">STEP 8</text>
  <text x="322" y="1148" class="t">🚀 Approve and go live</text>
  <text x="322" y="1170" class="d">Waiting on step 7</text>
  <text x="878" y="1124" text-anchor="end" class="s" fill="#b91c1c">✖ NOT YET</text>

  <!-- side note -->
  <rect x="60" y="1210" width="1080" height="96" rx="12" fill="#fffbeb" stroke="#b45309"/>
  <text x="82" y="1240" class="t">⚠ Side job: repair the GitHub automatic check (/implement)</text>
  <text x="82" y="1264" class="d">Started, then interrupted by a problem with the data connection, and never resumed.</text>
  <text x="82" y="1286" class="d">The move to .NET 10 done today is the first part of that job. The GitHub check itself is still out of date.</text>
</svg>
