<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1640" viewBox="0 0 1200 1640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .h1 { font-size: 34px; font-weight: 700; fill: #1f2937; }
      .sub { font-size: 17px; fill: #4b5563; }
      .sec { font-size: 22px; font-weight: 700; fill: #fff; }
      .name { font-size: 17px; font-weight: 700; fill: #111827; }
      .file { font-size: 13px; fill: #6b7280; font-family: Consolas, monospace; }
      .txt { font-size: 15px; fill: #374151; }
      .warn { font-size: 15px; fill: #991b1b; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="1640" fill="#f9fafb"/>

  <!-- Title -->
  <text x="600" y="58" text-anchor="middle" class="h1">How Claude is set up for the Larchmont Hotels project</text>
  <text x="600" y="90" text-anchor="middle" class="sub">Folder: track-4-hospitality · Plain-English guide for everyone</text>

  <!-- Handbook -->
  <rect x="40" y="120" width="1120" height="110" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="120" width="1120" height="38" rx="14" fill="#2563eb"/>
  <rect x="40" y="144" width="1120" height="14" fill="#2563eb"/>
  <text x="60" y="146" class="sec">📘 The Handbook &amp; House Rules</text>
  <text x="60" y="184" class="name">CLAUDE.md</text>
  <text x="200" y="184" class="txt">Claude reads this every time it starts: what the hotel system does and the house rules.</text>
  <text x="60" y="214" class="name">.claude/rules/</text>
  <text x="200" y="214" class="txt">Style guides: how code and tests should be written.</text>

  <!-- Commands -->
  <rect x="40" y="250" width="1120" height="170" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="40" y="250" width="1120" height="38" rx="14" fill="#7c3aed"/>
  <rect x="40" y="274" width="1120" height="14" fill="#7c3aed"/>
  <text x="60" y="276" class="sec">🔘 Shortcut Buttons (you type these)</text>
  <text x="60" y="318" class="name">/plan</text>
  <text x="200" y="318" class="txt">"Think it through and write the plan down. Don't build yet."</text>
  <text x="60" y="348" class="name">/implement</text>
  <text x="200" y="348" class="txt">"Here's the plan. Get the team to build it, then check it."</text>
  <text x="60" y="378" class="name">/handoff</text>
  <text x="200" y="378" class="txt">"Write a note for whoever works on this next."</text>
  <text x="60" y="408" class="name">/reflect</text>
  <text x="200" y="408" class="txt">"Is there a repeated chore we could automate?"</text>

  <!-- Team -->
  <rect x="40" y="440" width="1120" height="470" rx="14" fill="#fff" stroke="#059669" stroke-width="2"/>
  <rect x="40" y="440" width="1120" height="38" rx="14" fill="#059669"/>
  <rect x="40" y="464" width="1120" height="14" fill="#059669"/>
  <text x="60" y="466" class="sec">👥 The Team (helpers Claude hands work to)</text>

  <!-- planner -->
  <rect x="420" y="498" width="360" height="80" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="600" y="526" text-anchor="middle" class="name">🧭 Project Manager</text>
  <text x="600" y="546" text-anchor="middle" class="file">planner</text>
  <text x="600" y="567" text-anchor="middle" class="txt">Splits a request into tasks and hands them out</text>

  <line x1="600" y1="578" x2="600" y2="600" stroke="#555" stroke-width="2"/>
  <line x1="220" y1="600" x2="980" y2="600" stroke="#555" stroke-width="2"/>
  <line x1="220" y1="600" x2="220" y2="622" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="600" x2="600" y2="622" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="600" x2="980" y2="622" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="595" class="file">work at the same time</text>

  <rect x="70" y="625" width="300" height="100" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="220" y="652" text-anchor="middle" class="name">🔧 Back-office Builder</text>
  <text x="220" y="672" text-anchor="middle" class="file">backend</text>
  <text x="220" y="695" text-anchor="middle" class="txt">Builds the data and</text>
  <text x="220" y="714" text-anchor="middle" class="txt">behind-the-scenes logic</text>

  <rect x="450" y="625" width="300" height="100" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="600" y="652" text-anchor="middle" class="name">🎨 Screen Designer</text>
  <text x="600" y="672" text-anchor="middle" class="file">frontend</text>
  <text x="600" y="695" text-anchor="middle" class="txt">Builds what staff</text>
  <text x="600" y="714" text-anchor="middle" class="txt">see and click</text>

  <rect x="830" y="625" width="300" height="100" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="980" y="652" text-anchor="middle" class="name">🧪 Tester</text>
  <text x="980" y="672" text-anchor="middle" class="file">test-writer</text>
  <text x="980" y="695" text-anchor="middle" class="txt">Writes checks that prove</text>
  <text x="980" y="714" text-anchor="middle" class="txt">each feature really works</text>

  <line x1="220" y1="725" x2="220" y2="745" stroke="#555" stroke-width="2"/>
  <line x1="600" y1="725" x2="600" y2="745" stroke="#555" stroke-width="2"/>
  <line x1="980" y1="725" x2="980" y2="745" stroke="#555" stroke-width="2"/>
  <line x1="220" y1="745" x2="980" y2="745" stroke="#555" stroke-width="2"/>
  <line x1="600" y1="745" x2="600" y2="767" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="380" y="770" width="440" height="100" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="600" y="797" text-anchor="middle" class="name">🔍 Inspector</text>
  <text x="600" y="817" text-anchor="middle" class="file">reviewer</text>
  <text x="600" y="840" text-anchor="middle" class="txt">Checks the work against a checklist and writes a report.</text>
  <text x="600" y="859" text-anchor="middle" class="txt">Points out problems, doesn't fix them.</text>

  <rect x="860" y="770" width="270" height="120" rx="10" fill="#f0fdf4" stroke="#059669" stroke-dasharray="6,4"/>
  <text x="995" y="797" text-anchor="middle" class="name">📊 Data Expert</text>
  <text x="995" y="817" text-anchor="middle" class="file">db-analyst · called in separately</text>
  <text x="995" y="840" text-anchor="middle" class="txt">Studies how hotel data is</text>
  <text x="995" y="859" text-anchor="middle" class="txt">stored and spots anything</text>
  <text x="995" y="878" text-anchor="middle" class="txt">that could slow it down</text>

  <!-- Skills -->
  <rect x="40" y="930" width="1120" height="140" rx="14" fill="#fff" stroke="#d97706" stroke-width="2"/>
  <rect x="40" y="930" width="1120" height="38" rx="14" fill="#d97706"/>
  <rect x="40" y="954" width="1120" height="14" fill="#d97706"/>
  <text x="60" y="956" class="sec">📝 Skills (step-by-step recipes Claude follows when they fit)</text>
  <text x="60" y="998" class="name">spec-writer</text>
  <text x="240" y="998" class="txt">Turns a manager's wish-list into clear requirements.</text>
  <text x="60" y="1028" class="name">prompt-journal</text>
  <text x="240" y="1028" class="txt">Keeps a diary of what was asked and how it went.</text>
  <text x="60" y="1058" class="name">session-handoff</text>
  <text x="240" y="1058" class="txt">Writes an "end of shift" note.</text>

  <!-- Hooks -->
  <rect x="40" y="1090" width="1120" height="200" rx="14" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <rect x="40" y="1090" width="1120" height="38" rx="14" fill="#dc2626"/>
  <rect x="40" y="1114" width="1120" height="14" fill="#dc2626"/>
  <text x="60" y="1116" class="sec">🚨 Automatic Safety Checks (nobody has to press anything)</text>
  <text x="60" y="1158" class="name">Before any command</text>
  <text x="290" y="1158" class="txt">Blocks risky commands, like deleting everything.</text>
  <text x="60" y="1188" class="name">After a code change</text>
  <text x="290" y="1188" class="txt">Rebuilds the code straight away to catch mistakes.</text>
  <text x="60" y="1218" class="name">Every message you send</text>
  <text x="290" y="1218" class="txt">Saved to a log.</text>
  <text x="60" y="1248" class="name">When Claude finishes</text>
  <text x="290" y="1248" class="txt">Leaves an end-of-shift note.</text>
  <text x="60" y="1276" class="file">(There is also one placeholder check, noop.js, that does nothing.)</text>

  <!-- MCP + plugin -->
  <rect x="40" y="1310" width="740" height="160" rx="14" fill="#fff" stroke="#0891b2" stroke-width="2"/>
  <rect x="40" y="1310" width="740" height="38" rx="14" fill="#0891b2"/>
  <rect x="40" y="1334" width="740" height="14" fill="#0891b2"/>
  <text x="60" y="1336" class="sec">🔌 Data Connection</text>
  <text x="60" y="1378" class="name">larchmont</text>
  <text x="60" y="1404" class="txt">Lets Claude look at the hotel database (bookings, rooms and so on).</text>
  <text x="60" y="1426" class="txt">Look-only access, so it can't change anything.</text>
  <text x="60" y="1454" class="warn">⚠ Its password is written in plain text in the settings file.</text>

  <rect x="800" y="1310" width="360" height="160" rx="14" fill="#fff" stroke="#db2777" stroke-width="2"/>
  <rect x="800" y="1310" width="360" height="38" rx="14" fill="#db2777"/>
  <rect x="800" y="1334" width="360" height="14" fill="#db2777"/>
  <text x="820" y="1336" class="sec">🎀 Add-on</text>
  <text x="820" y="1378" class="name">ponytail</text>
  <text x="820" y="1404" class="txt">A small extra that shows</text>
  <text x="820" y="1426" class="txt">a welcome banner.</text>

  <!-- Footer -->
  <rect x="40" y="1490" width="1120" height="110" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="60" y="1524" class="name">ℹ How to switch it on</text>
  <text x="60" y="1552" class="txt">Open the track-4-hospitality folder on its own and start Claude there.</text>
  <text x="60" y="1578" class="txt">The data connection also needs the database running, and the add-on has to be switched on separately.</text>
</svg>
